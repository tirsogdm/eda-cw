- name: Install celery systemd unit
  ansible.builtin.template:
    src: celery.service.j2
    dest: /etc/systemd/system/celery-worker.service
    mode: '0644'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start celery service
  ansible.builtin.systemd:
    name: celery-worker
    enabled: true
    state: started