- name: Install celery-ctl systemd unit
  ansible.builtin.template:
    src: celery-ctl-worker.service.j2
    dest: /etc/systemd/system/celery-ctl-worker.service
    mode: '0644'
  notify: Restart celery-ctl-worker service

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start celery-ctl service
  ansible.builtin.systemd:
    name: celery-ctl-worker
    enabled: true
    state: started