- name: Ensure base packages
  become: true
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - git
      - wget
      - curl
    state: present

- name: Ensure controller-node is resolvable
  ansible.builtin.lineinfile:
    path: /etc/hosts
    state: present
    regexp: 'controller-node$'
    line: "{{ hostvars[groups['controller'][0]].ansible_host }} controller-node"

- name: Create pipeline root directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ pipeline_root }}"
    - "{{ pipeline_code_dir }}"
    - "{{ pipeline_tools_dir }}"
    - "{{ pipeline_data_dir }}"

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ pipeline_venv_dir }}" # ansible_python_interpreter
    creates: "{{ pipeline_venv_dir }}/bin/activate"

- name: Upgrade pip in venv
  ansible.builtin.pip:
    virtualenv: "{{ pipeline_venv_dir }}"
    name: pip
    state: latest

- name: Install Python dependencies into venv
  ansible.builtin.pip:
    virtualenv: "{{ pipeline_venv_dir }}"
    name: "{{ python_deps }}"
  when: python_deps | default([]) | length > 0