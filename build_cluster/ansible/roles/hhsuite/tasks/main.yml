- name: Ensure HHsuite directory exists
  file:
    path: "{{ hhsuite_dir }}"
    state: directory
    mode: '0755'
  
- name: Download HHsuite static AVX2 tarball
  get_url:
    url: "{{ hhsuite_tar_url }}"
    dest: "{{ hhsuite_tar_path }}"
    mode: '0644'
    force: no
  when: hhsuite_tar_url | default('') | length > 0

- name: Extract HHsuite tarball
  unarchive:
    src: "{{ hhsuite_tar_path }}"
    dest: "{{ hhsuite_dir }}"
    remote_src: yes
    creates: "{{ hhsuite_dir }}/bin/hhsearch"
  when: hhsuite_tar_url | default('') | length > 0

