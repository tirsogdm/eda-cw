- name: Ensure code directory exists
  file:
    path: "{{ pipeline_code_dir }}"
    state: directory
    mode: '0755'

- name: Sync code from repository to pipeline code directory
  ansible.builtin.synchronize:
    src: "{{ repo_dir }}/code/"
    dest: "{{ pipeline_code_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.git"