- name: Ensure data directory exists on worker
  ansible.builtin.file:
    path: "{{ pipeline_data_dir }}"
    state: directory
    mode: '0755'

- name: Check if FASTA already exists
  ansible.builtin.stat:
    path: "{{ proteome_fasta_path }}"
  register: fasta_stat

# Download mouse proteome FASTA gzip
- name: Download Mouse Proteome Fasta gzip
  ansible.builtin.get_url:
    url: "{{ proteome_fasta_url }}"
    dest: "{{ proteome_fasta_path }}.gz"
    mode: '0644'
    force: no
  when:
    - proteome_fasta_url | default('') | length > 0
    - not fasta_stat.stat.exists

- name: Decompress FASTA
  ansible.builtin.command:
    cmd: "gunzip -kf {{ proteome_fasta_path }}.gz"
  args:
    creates: "{{ proteome_fasta_path }}"
  when:
    - proteome_fasta_url | default('') | length > 0
    - not fasta_stat.stat.exists

- name: Remove FASTA gzip after decompression
  ansible.builtin.file:
    path: "{{ proteome_fasta_path }}.gz"
    state: absent
  when: not fasta_stat.stat.exists

- name: Re-check FASTA exists
  ansible.builtin.stat:
    path: "{{ proteome_fasta_path }}"
  register: fasta_stat

- name: Fail if FASTA not found
  ansible.builtin.fail:
    msg: "Proteome FASTA file not found at {{ proteome_fasta_path }} after download and decompression."
  when: not fasta_stat.stat.exists

- name: Build mouse proteome SQLite database from FASTA on worker
  ansible.builtin.command:
    cmd: >
      {{ pipeline_venv_dir }}/bin/python
      {{ pipeline_code_dir }}/build_proteome_db.py
      {{ proteome_fasta_path }}
      {{ proteome_db_path }}
  args:
    chdir: "{{ pipeline_code_dir }}"
    creates: "{{ proteome_db_path }}"